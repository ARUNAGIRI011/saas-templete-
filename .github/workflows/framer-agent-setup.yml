name: Install Framer Agent skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/framer-agent-setup.yml"
      - "framer/**"
      - "docs/FRAMER-GITHUB-ACTIONS.md"

permissions:
  contents: read

jobs:
  install-framer-agent:
    name: Bootstrap Framer Agent
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Framer Agent and its skills
        run: npx --yes @framer/agent@latest setup

      - name: Verify skill installation
        shell: bash
        run: |
          set -euo pipefail
          echo "Installed skill files:"
          find "$HOME/.agents/skills" "$HOME/.claude/skills" \
            -type f -iname "SKILL.md" -print 2>/dev/null || true

          if ! find "$HOME/.agents/skills" "$HOME/.claude/skills" \
            -type f -iname "SKILL.md" -print -quit 2>/dev/null | grep -q .; then
            echo "::error::Framer setup completed but no SKILL.md files were found in the expected skill directories."
            exit 1
          fi

          echo "Framer Agent skill installation verified for this runner."
